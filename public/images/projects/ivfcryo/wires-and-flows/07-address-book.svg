<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="1400" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="22" font-weight="bold" fill="#333333">Address Book</text>
  <line x1="40" y1="70" x2="1360" y2="70" stroke="#cccccc" stroke-width="1"/>

  <!-- Browser frame -->
  <rect x="40" y="100" width="1320" height="1270" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1360" y2="140" stroke="#999999" stroke-width="1.5"/>
  <circle cx="62" cy="120" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <circle cx="80" cy="120" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <circle cx="98" cy="120" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <rect x="120" y="108" width="300" height="24" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="132" y="124" font-size="11" fill="#666666">ivfcryo.com/contacts</text>

  <!-- App header -->
  <line x1="40" y1="190" x2="1360" y2="190" stroke="#999999" stroke-width="1.5"/>
  <rect x="62" y="153" width="22" height="22" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="94" y="170" font-size="14" font-weight="bold" fill="#333333">IVFCRYO</text>
  <rect x="1256" y="152" width="86" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1299" y="171" font-size="13" fill="#333333" text-anchor="middle">Logout</text>

  <!-- Sidebar -->
  <line x1="270" y1="190" x2="270" y2="1370" stroke="#999999" stroke-width="1.5"/>
  <text x="62" y="225" font-size="13" fill="#333333">New Shipment</text>
  <text x="62" y="263" font-size="13" fill="#333333">Shipments</text>
  <line x1="62" y1="285" x2="248" y2="285" stroke="#cccccc" stroke-width="1"/>
  <text x="62" y="311" font-size="13" fill="#333333">Package Types</text>
  <text x="62" y="349" font-size="13" fill="#333333">Senseaware Trackers</text>
  <text x="62" y="387" font-size="13" fill="#333333">Dry Shippers</text>
  <rect x="52" y="414" width="196" height="30" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="62" y="434" font-size="13" font-weight="bold" fill="#333333">Address Book</text>
  <text x="62" y="473" font-size="13" fill="#333333">Users</text>
  <text x="62" y="511" font-size="13" fill="#333333">Admin Settings</text>
  <text x="62" y="549" font-size="13" fill="#333333">Shipment Feedbacks</text>

  <!-- Main header -->
  <text x="300" y="232" font-size="14" font-weight="bold" fill="#333333">My Contacts</text>
  <rect x="1200" y="212" width="140" height="32" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="1270" y="233" font-size="13" fill="#333333" text-anchor="middle">New Contact</text>
  <line x1="270" y1="262" x2="1360" y2="262" stroke="#cccccc" stroke-width="1"/>

  <!-- Search / filter row -->
  <rect x="300" y="286" width="520" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="312" y="308" font-size="11" fill="#666666">Search</text>
  <rect x="840" y="286" width="180" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="852" y="308" font-size="11" fill="#666666">All contacts</text>
  <path d="M 995 300 L 1002 308 L 1009 300" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="1040" y="286" width="110" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1095" y="308" font-size="13" fill="#333333" text-anchor="middle">Filter</text>

  <!-- Contact card 1 -->
  <rect x="300" y="340" width="1040" height="110" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="318" y="368" font-size="13" font-weight="bold" fill="#333333">Contact name</text>
  <text x="318" y="390" font-size="11" fill="#666666">Attention / person</text>
  <text x="318" y="410" font-size="11" fill="#666666">Street, city, state, postal, country</text>
  <text x="318" y="430" font-size="11" fill="#666666">Phone · email</text>
  <rect x="700" y="352" width="140" height="24" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="770" y="368" font-size="11" fill="#333333" text-anchor="middle">Default Pickup</text>
  <rect x="1220" y="354" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1268" y="373" font-size="13" fill="#333333" text-anchor="middle">Edit</text>
  <rect x="1220" y="392" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1268" y="411" font-size="13" fill="#333333" text-anchor="middle">Delete</text>

  <!-- Contact card 2 -->
  <rect x="300" y="460" width="1040" height="110" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="318" y="488" font-size="13" font-weight="bold" fill="#333333">Contact name</text>
  <text x="318" y="510" font-size="11" fill="#666666">Attention / person</text>
  <text x="318" y="530" font-size="11" fill="#666666">Street, city, state, postal, country</text>
  <text x="318" y="550" font-size="11" fill="#666666">Phone · email</text>
  <rect x="700" y="472" width="140" height="24" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="770" y="488" font-size="11" fill="#333333" text-anchor="middle">Default Delivery</text>
  <rect x="1220" y="474" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1268" y="493" font-size="13" fill="#333333" text-anchor="middle">Edit</text>
  <rect x="1220" y="512" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1268" y="531" font-size="13" fill="#333333" text-anchor="middle">Delete</text>

  <!-- Contact card 3 -->
  <rect x="300" y="580" width="1040" height="110" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="318" y="608" font-size="13" font-weight="bold" fill="#333333">Contact name</text>
  <text x="318" y="630" font-size="11" fill="#666666">Attention / person</text>
  <text x="318" y="650" font-size="11" fill="#666666">Street, city, state, postal, country</text>
  <text x="318" y="670" font-size="11" fill="#666666">Phone · email</text>
  <rect x="1220" y="594" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1268" y="613" font-size="13" fill="#333333" text-anchor="middle">Edit</text>
  <rect x="1220" y="632" width="96" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1268" y="651" font-size="13" fill="#333333" text-anchor="middle">Delete</text>

  <!-- Form section -->
  <line x1="300" y1="716" x2="1340" y2="716" stroke="#cccccc" stroke-width="1"/>
  <text x="300" y="746" font-size="14" font-weight="bold" fill="#333333">New Contact / Edit Contact</text>

  <!-- Row 1 -->
  <text x="300" y="785" font-size="11" fill="#666666">Company Name</text>
  <rect x="300" y="792" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="785" font-size="11" fill="#666666">First Name</text>
  <rect x="850" y="792" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <!-- Row 2 -->
  <text x="300" y="847" font-size="11" fill="#666666">Last Name</text>
  <rect x="300" y="854" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="847" font-size="11" fill="#666666">Street Address</text>
  <rect x="850" y="854" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="1310" cy="870" r="6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="1314" y1="874" x2="1319" y2="879" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="900" font-size="11" fill="#666666">Places autocomplete · validated and geocoded on save</text>

  <!-- Row 3 -->
  <text x="300" y="915" font-size="11" fill="#666666">Street Address 2</text>
  <rect x="300" y="922" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="915" font-size="11" fill="#666666">Street Address 3</text>
  <rect x="850" y="922" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <!-- Row 4 -->
  <text x="300" y="977" font-size="11" fill="#666666">City</text>
  <rect x="300" y="984" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="977" font-size="11" fill="#666666">State / Region</text>
  <rect x="850" y="984" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <path d="M 1303 996 L 1310 1004 L 1317 996" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Row 5 -->
  <text x="300" y="1039" font-size="11" fill="#666666">Postal Code</text>
  <rect x="300" y="1046" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="1039" font-size="11" fill="#666666">Country</text>
  <rect x="850" y="1046" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <path d="M 1303 1058 L 1310 1066 L 1317 1058" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Row 6 -->
  <text x="300" y="1101" font-size="11" fill="#666666">Phone Number</text>
  <rect x="300" y="1108" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="1101" font-size="11" fill="#666666">Email Address</text>
  <rect x="850" y="1108" width="490" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <!-- Checkbox row -->
  <rect x="300" y="1170" width="16" height="16" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1183" font-size="13" fill="#333333">Default Pickup Address?</text>
  <rect x="620" y="1170" width="16" height="16" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <path d="M 624 1178 L 628 1183 L 633 1174" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="646" y="1183" font-size="13" fill="#333333">Default Delivery Address?</text>
  <rect x="950" y="1170" width="16" height="16" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="976" y="1183" font-size="13" fill="#333333">Disable this contact?</text>

  <!-- Textarea -->
  <text x="300" y="1223" font-size="11" fill="#666666">Default Shipping Instructions</text>
  <rect x="300" y="1230" width="1040" height="76" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <!-- Actions -->
  <rect x="300" y="1326" width="150" height="34" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="375" y="1348" font-size="13" fill="#333333" text-anchor="middle">Save Contact</text>
  <rect x="470" y="1326" width="120" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="1348" font-size="13" fill="#333333" text-anchor="middle">Cancel</text>
</svg>
