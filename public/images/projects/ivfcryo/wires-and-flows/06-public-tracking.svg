<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300">
  <rect x="0" y="0" width="1400" height="1300" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333">Public Tracking Page</text>
  <line x1="40" y1="70" x2="1360" y2="70" stroke="#cccccc" stroke-width="1"/>

  <!-- Browser frame -->
  <rect x="40" y="100" width="1320" height="1160" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>

  <!-- Browser chrome -->
  <line x1="40" y1="145" x2="1360" y2="145" stroke="#999999" stroke-width="1.5"/>
  <circle cx="65" cy="122" r="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="87" cy="122" r="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="109" cy="122" r="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="140" y="109" width="560" height="26" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="154" y="127" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">URL — /shipments/tracking?id=</text>

  <!-- Header bar -->
  <line x1="40" y1="200" x2="1360" y2="200" stroke="#999999" stroke-width="1.5"/>
  <rect x="70" y="158" width="28" height="28" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">IVFCRYO</text>
  <rect x="1230" y="158" width="90" height="30" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1275" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Login</text>

  <!-- Hero status panel -->
  <rect x="70" y="220" width="1260" height="110" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="95" y="268" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333">Plain-language status headline</text>
  <text x="95" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Estimated delivery · [date and time]</text>
  <rect x="1140" y="245" width="130" height="28" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="1205" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Status</text>
  <text x="1305" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end">Shipment ID</text>

  <!-- Progress tracker -->
  <rect x="70" y="350" width="1260" height="130" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="248" y1="400" x2="552" y2="400" stroke="#333333" stroke-width="1.5"/>
  <line x1="588" y1="400" x2="892" y2="400" stroke="#333333" stroke-width="1.5"/>
  <line x1="928" y1="400" x2="1232" y2="400" stroke="#333333" stroke-width="1.5"/>

  <circle cx="230" cy="400" r="18" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="230" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">1</text>
  <text x="230" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Created</text>
  <text x="230" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Done · [timestamp]</text>

  <circle cx="570" cy="400" r="18" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">2</text>
  <text x="570" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Picked Up</text>
  <text x="570" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Done · [timestamp]</text>

  <circle cx="910" cy="400" r="18" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="910" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">3</text>
  <text x="910" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">In Transit</text>
  <text x="910" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Current step · [timestamp]</text>

  <circle cx="1250" cy="400" r="18" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1250" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">4</text>
  <text x="1250" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Delivered</text>
  <text x="1250" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Upcoming · [timestamp]</text>

  <!-- Map placeholder -->
  <rect x="70" y="505" width="1260" height="200" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="70" y1="505" x2="1330" y2="705" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1330" y1="505" x2="70" y2="705" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="580" y="590" width="240" height="30" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="700" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Live position — [city]</text>

  <!-- Last sensor reading -->
  <rect x="70" y="730" width="1260" height="48" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="92" y="759" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Last Sensor Reading</text>
  <text x="250" y="759" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Within range · recorded [timestamp]</text>
  <text x="1308" y="759" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end">Temperature nominal</text>

  <!-- Shipping details -->
  <text x="70" y="818" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Shipping Details</text>
  <rect x="70" y="835" width="1260" height="150" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="700" y1="835" x2="700" y2="985" stroke="#999999" stroke-width="1.5"/>
  <line x1="70" y1="885" x2="1330" y2="885" stroke="#999999" stroke-width="1.5"/>
  <line x1="70" y1="935" x2="1330" y2="935" stroke="#999999" stroke-width="1.5"/>

  <text x="92" y="866" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Status</text>
  <rect x="250" y="848" width="120" height="24" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="310" y="865" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Status</text>
  <text x="722" y="866" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Package Type</text>
  <text x="880" y="866" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">[value]</text>

  <text x="92" y="916" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Shipment ID</text>
  <text x="250" y="916" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">[value]</text>
  <text x="722" y="916" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Initiator</text>
  <text x="880" y="916" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">[value]</text>

  <text x="92" y="966" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Submitted On</text>
  <text x="250" y="966" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">[value]</text>
  <text x="722" y="966" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Service Level</text>
  <text x="880" y="966" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">[value]</text>

  <!-- Pickup / Delivery -->
  <text x="70" y="1018" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Pickup Details</text>
  <text x="720" y="1018" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Delivery Details</text>

  <rect x="70" y="1035" width="610" height="120" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="92" y="1065" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Origin facility name</text>
  <text x="92" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Street address, city, state</text>
  <text x="92" y="1113" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Phone</text>
  <text x="92" y="1136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Picked up · [timestamp]</text>

  <rect x="720" y="1035" width="610" height="120" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="742" y="1065" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Destination facility name</text>
  <text x="742" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Street address, city, state</text>
  <text x="742" y="1113" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Phone</text>
  <text x="742" y="1136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Scheduled est. · [timestamp]</text>

  <!-- Footer support block -->
  <line x1="70" y1="1185" x2="1330" y2="1185" stroke="#cccccc" stroke-width="1"/>
  <text x="70" y="1210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Questions about this shipment?</text>
  <text x="70" y="1232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Call support — [phone, 24 hours] · [support email]</text>
  <text x="70" y="1252" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Quote shipment ID when you call.</text>
  <text x="1330" y="1210" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end">IVFCRYO · Cold-chain logistics</text>
</svg>
