<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1460" viewBox="0 0 1400 1460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="1460" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#333333">New Shipment</text>
  <line x1="40" y1="60" x2="1360" y2="60" stroke="#cccccc" stroke-width="1"/>

  <!-- Browser frame -->
  <rect x="40" y="90" width="1320" height="1320" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <line x1="40" y1="130" x2="1360" y2="130" stroke="#999999" stroke-width="1.5"/>
  <circle cx="62" cy="110" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <circle cx="78" cy="110" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <circle cx="94" cy="110" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <rect x="120" y="100" width="320" height="20" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="132" y="114" font-size="11" fill="#666666">url</text>

