  <rect x="280" y="1014" width="1050" height="132" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <line x1="805" y1="1014" x2="805" y2="1146" stroke="#cccccc" stroke-width="1"/>
  <text x="302" y="1038" font-size="13" font-weight="bold" fill="#333333">Email</text>
  <rect x="302" y="1052" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1064" font-size="13" fill="#333333">Notification event 1</text>
  <rect x="302" y="1078" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1090" font-size="13" fill="#333333">Notification event 2</text>
  <rect x="302" y="1104" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1116" font-size="13" fill="#333333">Notification event 3</text>
  <text x="826" y="1038" font-size="13" font-weight="bold" fill="#333333">Phone</text>
  <rect x="826" y="1052" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="1064" font-size="13" fill="#333333">Notification event 1</text>
  <rect x="826" y="1078" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="1090" font-size="13" fill="#333333">Notification event 2</text>
  <rect x="826" y="1104" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="1116" font-size="13" fill="#333333">Notification event 3</text>

