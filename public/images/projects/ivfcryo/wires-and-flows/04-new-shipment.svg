  <rect x="62" y="142" width="20" height="20" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="92" y="158" font-size="14" font-weight="bold" fill="#333333">IVFCRYO</text>
  <rect x="1250" y="140" width="90" height="26" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1272" y="157" font-size="13" fill="#333333">Logout</text>

