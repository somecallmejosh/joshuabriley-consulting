  <circle cx="1288" cy="808" r="5" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="1292" y1="812" x2="1297" y2="817" stroke="#333333" stroke-width="1.5"/>
  <rect x="840" y="838" width="470" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="854" y="858" font-size="13" font-weight="bold" fill="#333333">Selected contact</text>
  <text x="854" y="876" font-size="11" fill="#666666">Name &#183; phone</text>
  <text x="854" y="892" font-size="11" fill="#666666">Address &#183; email</text>
  <rect x="840" y="910" width="140" height="26" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="856" y="927" font-size="11" fill="#333333">Add New Contact</text>
