  <rect x="620" y="434" width="300" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="890" y="443" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="960" y="426" font-size="11" fill="#666666">Reference Number</text>
  <rect x="960" y="434" width="240" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="486" font-size="11" fill="#666666">Helper text: earliest pickup rule</text>

  <!-- 3. Upgrade -->
  <text x="280" y="522" font-size="14" font-weight="bold" fill="#333333">3. Upgrade to IVF CRYO-Shield</text>
  <line x1="280" y1="534" x2="1330" y2="534" stroke="#cccccc" stroke-width="1"/>
  <circle cx="288" cy="558" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="288" cy="558" r="3" fill="#333333"/>
  <text x="304" y="562" font-size="13" fill="#333333">Yes</text>
  <circle cx="380" cy="558" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="396" y="562" font-size="13" fill="#333333">No</text>
  <circle cx="490" cy="558" r="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="486" y="562" font-size="11" fill="#333333">?</text>
  <text x="510" y="562" font-size="11" fill="#666666">Coverage help link</text>

