  <line x1="280" y1="280" x2="1330" y2="280" stroke="#cccccc" stroke-width="1"/>
  <text x="280" y="302" font-size="11" fill="#666666">Service Type</text>
  <rect x="280" y="310" width="500" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <polyline points="748,322 756,332 764,322" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="820" y="306" width="380" height="42" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="836" y="322" font-size="11" fill="#666666">PRICE QUOTE</text>
  <text x="836" y="341" font-size="13" font-weight="bold" fill="#333333">$ ---</text>

  <!-- 2. Schedule &amp; Reference -->
  <text x="280" y="392" font-size="14" font-weight="bold" fill="#333333">2. Schedule &amp; Reference</text>
  <line x1="280" y1="404" x2="1330" y2="404" stroke="#cccccc" stroke-width="1"/>
  <text x="280" y="426" font-size="11" fill="#666666">Pickup Date &amp; Time</text>
