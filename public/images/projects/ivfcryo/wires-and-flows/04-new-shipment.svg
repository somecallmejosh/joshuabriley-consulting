  <text x="280" y="1188" font-size="14" font-weight="bold" fill="#333333">7. Insurance</text>
  <line x1="280" y1="1200" x2="1330" y2="1200" stroke="#cccccc" stroke-width="1"/>
  <rect x="280" y="1214" width="1050" height="176" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="302" y="1236" font-size="11" fill="#666666">COVERAGE LEVEL</text>
  <rect x="302" y="1246" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1258" font-size="13" fill="#333333">Tier 1</text>
  <rect x="452" y="1246" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="476" y="1258" font-size="13" fill="#333333">Tier 2</text>
  <rect x="602" y="1246" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="626" y="1258" font-size="13" fill="#333333">Tier 3</text>

  <text x="302" y="1292" font-size="13" fill="#333333">Is the account owner the covered party?</text>
  <circle cx="309" cy="1314" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1318" font-size="13" fill="#333333">Yes</text>
  <circle cx="409" cy="1314" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="409" cy="1314" r="3" fill="#333333"/>
  <text x="426" y="1318" font-size="13" fill="#333333">No</text>

  <text x="302" y="1344" font-size="11" fill="#666666">Business Name</text>
  <rect x="302" y="1350" width="280" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="602" y="1344" font-size="11" fill="#666666">First Name</text>
  <rect x="602" y="1350" width="260" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="882" y="1344" font-size="11" fill="#666666">Last Name</text>
  <rect x="882" y="1350" width="260" height="28" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>

  <!-- Tissue type + agreement + submit -->
  <text x="302" y="1412" font-size="11" fill="#666666">TISSUE TYPE</text>
  <rect x="302" y="1422" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="326" y="1434" font-size="13" fill="#333333">Type A</text>
  <rect x="432" y="1422" width="14" height="14" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="456" y="1434" font-size="13" fill="#333333">Type B</text>
  <rect x="562" y="1422" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="586" y="1434" font-size="13" fill="#333333">Type C</text>
  <rect x="692" y="1422" width="14" height="14" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
