  <circle cx="302" cy="650" r="3" fill="#333333"/>
  <text x="320" y="654" font-size="13" fill="#333333">Package option A</text>
  <text x="320" y="674" font-size="11" fill="#666666">Dimensions</text>
  <text x="320" y="692" font-size="11" fill="#666666">Hold time &#183; capacity</text>
  <rect x="640" y="626" width="330" height="80" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="662" cy="650" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="680" y="654" font-size="13" fill="#333333">Package option B</text>
  <text x="680" y="674" font-size="11" fill="#666666">Dimensions</text>
  <text x="680" y="692" font-size="11" fill="#666666">Hold time &#183; capacity</text>
  <rect x="1000" y="626" width="330" height="80" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="1022" cy="650" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
