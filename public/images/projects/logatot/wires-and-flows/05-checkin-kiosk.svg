<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333">Check-in Kiosk</text>
  <line x1="40" y1="68" x2="1360" y2="68" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">The tablet handed across the doorway — a single card with nowhere to go.</text>

  <!-- Panel labels -->
  <text x="60" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">01 — PIN entry</text>
  <text x="680" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="end">Anyone may see this</text>
  <text x="720" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">02 — Children, then signature</text>
  <text x="1340" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="end">Scoped to one PIN</text>

  <!-- Panel 01 card — dark full-bleed, drawn as heavy outline -->
  <rect x="60" y="150" width="620" height="660" rx="2" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="84" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">BRIGHT START FAMILY CARE</text>
  <rect x="430" y="170" width="226" height="24" rx="12" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="543" y="186" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">NO SESSION · ACCOUNT ID ONLY</text>
  <line x1="84" y1="205" x2="656" y2="205" stroke="#cccccc" stroke-width="1"/>

  <!-- Daycare logo slot -->
  <rect x="84" y="222" width="572" height="54" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="370" y="254" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle">DAYCARE LOGO</text>

  <!-- Oversized PIN field -->
  <text x="370" y="306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">Enter your 4-digit PIN</text>
  <rect x="84" y="322" width="572" height="96" rx="2" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <circle cx="310" cy="370" r="13" fill="#333333"/>
  <circle cx="354" cy="370" r="13" fill="#333333"/>
  <line x1="390" y1="350" x2="390" y2="390" stroke="#333333" stroke-width="2"/>
  <line x1="414" y1="370" x2="444" y2="370" stroke="#999999" stroke-width="2"/>
  <text x="656" y="436" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#999999" text-anchor="end">96PX TALL · 48PX TYPE · NO SUBMIT BUTTON</text>

  <!-- Keypad -->
  <rect x="84" y="452" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="174" y="492" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">1</text>
  <rect x="280" y="452" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="492" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">2</text>
  <rect x="476" y="452" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="492" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">3</text>

  <rect x="84" y="526" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="174" y="566" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">4</text>
  <rect x="280" y="526" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="566" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">5</text>
  <rect x="476" y="526" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="566" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">6</text>

  <rect x="84" y="600" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="174" y="640" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">7</text>
  <rect x="280" y="600" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="640" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">8</text>
  <rect x="476" y="600" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="640" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">9</text>

  <rect x="280" y="674" width="180" height="62" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="714" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">0</text>
  <rect x="476" y="674" width="180" height="62" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="566" y="711" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">DELETE</text>

  <text x="370" y="774" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Forgot your PIN? Hand the tablet back to your provider.</text>

  <!-- Panel 02 card — resolved state -->
  <rect x="720" y="150" width="620" height="660" rx="2" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="744" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">BRIGHT START FAMILY CARE</text>
  <rect x="1120" y="170" width="196" height="24" rx="12" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="1218" y="186" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">NOT YOU? START OVER</text>
  <line x1="744" y1="205" x2="1316" y2="205" stroke="#cccccc" stroke-width="1"/>

  <!-- Greeting -->
  <text x="744" y="250" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333">Hi,</text>
  <rect x="790" y="234" width="170" height="16" rx="8" fill="#e8e8e8"/>
  <text x="744" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Monday, July 20 · 3:34 pm — tap a child to check in or out.</text>

  <!-- Child list, filtered to this PIN -->
  <rect x="744" y="296" width="572" height="72" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="782" cy="332" r="18" fill="#e8e8e8" stroke="#999999" stroke-width="1.5"/>
  <rect x="814" y="316" width="160" height="12" rx="6" fill="#e8e8e8"/>
  <text x="814" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Checked in 7:42a · here 7h 52m</text>
  <rect x="1180" y="316" width="112" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1236" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Check out</text>

  <rect x="744" y="380" width="572" height="72" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="782" cy="416" r="18" fill="#e8e8e8" stroke="#999999" stroke-width="1.5"/>
  <rect x="814" y="400" width="126" height="12" rx="6" fill="#e8e8e8"/>
  <text x="814" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Not here yet · expected 8:30a</text>
  <rect x="1180" y="400" width="112" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="1236" y="421" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Check in</text>

  <!-- Inline signature canvas -->
  <text x="744" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">SIGNATURE — RELEASED TO THIS PIN</text>
  <text x="1316" y="490" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">CLEAR</text>
  <rect x="744" y="502" width="572" height="110" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1030" y="552" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle">SIGN HERE</text>
  <line x1="772" y1="588" x2="1288" y2="588" stroke="#999999" stroke-width="1"/>

  <!-- Confirm -->
  <rect x="744" y="630" width="572" height="52" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="2"/>
  <text x="1030" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Confirm check-out</text>
  <text x="1030" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">Signed at 3:34 pm and stored on this attendance event.</text>

  <!-- Authorized pickup note -->
  <rect x="744" y="718" width="572" height="58" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="766" y="744" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333">Authorized pickup</text>
  <text x="766" y="764" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">Own PIN, own permitted children — never the whole roster.</text>

  <!-- Intent note -->
  <rect x="340" y="836" width="720" height="46" rx="2" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="700" y="864" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Dark full-bleed card — no navigation, no back control, no account switcher.</text>
</svg>
