<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100">
  <rect x="0" y="0" width="1400" height="1100" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333">Application Shell</text>
  <line x1="40" y1="68" x2="1360" y2="68" stroke="#cccccc" stroke-width="1"/>

  <!-- Browser frame -->
  <rect x="40" y="95" width="1320" height="725" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>

  <!-- Browser chrome -->
  <rect x="40" y="95" width="1320" height="50" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <circle cx="66" cy="120" r="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="84" cy="120" r="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="102" cy="120" r="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="125" y="107" width="440" height="26" rx="13" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="141" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">VMSpark — /jobs/job_listings</text>

  <!-- Icon rail -->
  <line x1="140" y1="145" x2="140" y2="820" stroke="#333333" stroke-width="1.5"/>
  <rect x="77" y="168" width="26" height="26" rx="2" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <text x="90" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">Jobs</text>
  <rect x="77" y="230" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Mapping</text>
  <rect x="77" y="292" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Rate Plans</text>
  <rect x="77" y="354" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="396" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Settings</text>
  <rect x="77" y="416" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="458" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Admin</text>
  <text x="90" y="472" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#999999" text-anchor="middle">owner only</text>
  <line x1="66" y1="680" x2="114" y2="680" stroke="#cccccc" stroke-width="1"/>
  <rect x="77" y="700" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="742" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Density</text>
  <rect x="77" y="756" width="26" height="26" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <text x="90" y="798" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Help</text>

  <!-- Nav sidebar -->
  <line x1="440" y1="145" x2="440" y2="820" stroke="#333333" stroke-width="1.5"/>
  <text x="170" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">AREA</text>
  <text x="170" y="214" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333">Job Listings</text>

  <rect x="140" y="240" width="300" height="38" fill="#e8e8e8"/>
  <rect x="140" y="240" width="4" height="38" fill="#333333"/>
  <text x="170" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Job Listings</text>
  <circle cx="408" cy="259" r="13" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="408" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">12</text>

  <text x="170" y="308" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Manual Jobs</text>
  <text x="170" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Direct Client Jobs</text>
  <text x="170" y="392" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Candidates</text>
  <text x="170" y="434" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Candidate Profiles</text>
  <text x="170" y="476" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999999">Applications &amp; Matches</text>

  <!-- Shell top bar -->
  <line x1="440" y1="215" x2="1360" y2="215" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">WORKSPACE</text>
  <text x="470" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#333333">Cascade Staffing Group</text>
  <line x1="676" y1="188" x2="683" y2="195" stroke="#333333" stroke-width="1.5"/>
  <line x1="683" y1="195" x2="690" y2="188" stroke="#333333" stroke-width="1.5"/>

  <!-- Omnibox -->
  <rect x="722" y="163" width="318" height="32" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="740" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666666">Search jobs, candidates…</text>
  <rect x="994" y="170" width="34" height="18" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <text x="1011" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">⌘K</text>

  <!-- Impersonation control -->
  <rect x="1060" y="163" width="184" height="32" rx="2" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="1152" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Back to Owner View</text>
  <circle cx="1272" cy="179" r="13" fill="#e8e8e8" stroke="#999999" stroke-width="1.5"/>
  <text x="1294" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">J. Briley</text>

  <!-- Page content region -->
  <rect x="470" y="245" width="860" height="550" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="900" y="500" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Page content — see sheets 02–10</text>
  <text x="900" y="524" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Every screen renders inside this region. The shell around it never re-mounts.</text>

  <!-- Audit summary panel -->
  <rect x="500" y="640" width="800" height="125" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="522" y="673" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">What the audit found, and what the shell absorbs</text>
  <line x1="522" y1="687" x2="1278" y2="687" stroke="#cccccc" stroke-width="1"/>
  <text x="522" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Button styles</text>
  <text x="742" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">8+ → 1</text>
  <text x="782" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Form elements</text>
  <text x="1002" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">10+ → 1</text>
  <text x="1042" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Form patterns</text>
  <text x="1278" y="717" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">5 → 1</text>
  <text x="522" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Table conventions</text>
  <text x="742" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">6+ → 1</text>
  <text x="782" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Labelling rules</text>
  <text x="1002" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">4+ → 1</text>
  <text x="1042" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333">Views off-token</text>
  <text x="1278" y="745" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333" text-anchor="end">~40 → 0</text>

  <!-- State variants heading -->
  <text x="40" y="868" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333">STATE VARIANTS</text>
  <text x="170" y="868" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">the same frame, re-shaped by role and preference</text>

  <!-- Variant A — rail collapsed -->
  <rect x="40" y="885" width="424" height="190" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="62" y="916" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">A · RAIL COLLAPSED</text>
  <rect x="62" y="930" width="22" height="125" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <rect x="68" y="938" width="10" height="10" rx="2" fill="#333333"/>
  <rect x="68" y="956" width="10" height="10" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <rect x="68" y="974" width="10" height="10" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <rect x="96" y="930" width="346" height="125" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="269" y="988" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Panel hidden — content gains 280px.</text>
  <text x="269" y="1006" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Hover re-opens it as an overlay.</text>

  <!-- Variant B — read-only user -->
  <rect x="488" y="885" width="424" height="190" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="510" y="916" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">B · READ-ONLY USER</text>
  <rect x="510" y="930" width="22" height="125" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <rect x="516" y="938" width="10" height="10" rx="2" fill="#333333"/>
  <rect x="516" y="956" width="10" height="10" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <rect x="516" y="974" width="10" height="10" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <rect x="544" y="930" width="120" height="125" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <rect x="556" y="942" width="88" height="20" rx="2" fill="#f2f2f2" stroke="#999999" stroke-width="1"/>
  <text x="600" y="956" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">READ ONLY</text>
  <rect x="556" y="976" width="88" height="8" rx="4" fill="#e8e8e8"/>
  <rect x="556" y="992" width="70" height="8" rx="4" fill="#e8e8e8"/>
  <rect x="556" y="1008" width="80" height="8" rx="4" fill="#e8e8e8"/>
  <rect x="676" y="930" width="214" height="125" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="783" y="988" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Write actions removed,</text>
  <text x="783" y="1006" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">not just disabled.</text>

  <!-- Variant C — candidate user -->
  <rect x="936" y="885" width="424" height="190" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="958" y="916" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">C · CANDIDATE USER</text>
  <rect x="958" y="930" width="380" height="30" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="972" y="949" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333333">My Jobs</text>
  <text x="1026" y="949" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">Profile</text>
  <text x="1070" y="949" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666666">Documents</text>
  <circle cx="1318" cy="945" r="10" fill="#e8e8e8" stroke="#999999" stroke-width="1"/>
  <rect x="958" y="970" width="380" height="85" rx="2" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="1148" y="1006" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">No rail, no panel — candidates get a</text>
  <text x="1148" y="1024" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">top-nav consumer shell on the same app.</text>
</svg>
