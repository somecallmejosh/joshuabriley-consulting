<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Joshua Briley">
  <!-- Editorial-Technical monogram: a machined index plate. Ink tile, paper
       "JB" in monospace, and the signature clay period. -->
  <rect width="64" height="64" rx="13" fill="#1B1A17"/>
  <g fill="#F5F4F1" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-weight="700">
    <text x="9" y="43" font-size="31" letter-spacing="-1">JB</text>
  </g>
  <!-- clay brand-dot — brightened clay for the dark surface (#D86A4A) -->
  <circle cx="51.5" cy="41" r="3.4" fill="#D86A4A"/>
</svg>
